# Applied last. The imported Linux configuration is never edited.
set $term wt.exe -w new
set $menu swaywin-launcher
set $font Segoe UI 10
set $bg #000000
set $fg #e6e6e6
set $acid #0078D4
set $dim #191919
set $mute #7d7d7d
set $urgent #ffffff

# Identity mapping only; does not disable displays or change refresh rates.
windows_output DP-1 \\.\DISPLAY1

# Native fallbacks for keys that do not have portable Windows virtual-key codes.
bindsym --to-code $mod+Ctrl+m exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --to-code $mod+Ctrl+Up exec brightnessctl set 5%+
bindsym --to-code $mod+Ctrl+Down exec brightnessctl set 5%-
